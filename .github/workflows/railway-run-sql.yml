name: Railway Database Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    name: Apply Admin Update to Railway PostgreSQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Inspect and Fix Admin Accounts
        env:
          DB_URL: ${{ secrets.RAILWAY_STAGING_DATABASE_URL }}
        run: |
          echo "=== 1. Inspecting User Table ==="
          psql "$DB_URL" -c "SELECT id, email, first_name, last_name FROM \"user\";"
          
          echo "=== 2. Inspecting Provider Identity Table ==="
          psql "$DB_URL" -c "SELECT id, entity_id, provider, auth_identity_id, (provider_metadata IS NOT NULL) AS has_meta, left(provider_metadata->>'password', 20) AS pass_start FROM provider_identity;"

          echo "=== 3. Inspecting Auth Identity Table ==="
          psql "$DB_URL" -c "SELECT id, app_metadata FROM auth_identity;"
