name: Railway Database Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    name: Apply Admin Update to Railway PostgreSQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Apply Admin Migration
        env:
          DB_URL: ${{ secrets.RAILWAY_STAGING_DATABASE_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::Secret RAILWAY_STAGING_DATABASE_URL is not configured."
            exit 1
          fi
          echo "Executing update-admin-to-sana.sql on Railway database..."
          psql "$DB_URL" -f backend/scripts/update-admin-to-sana.sql
          echo "Verifying users in Railway database:"
          psql "$DB_URL" -c "SELECT id, email, first_name, last_name FROM \"user\";"
          psql "$DB_URL" -c "SELECT id, provider, entity_id FROM provider_identity;"
