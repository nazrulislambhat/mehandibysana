name: Railway Database Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    name: Apply Admin Update to Railway PostgreSQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Inspect Database Name and API Keys
        env:
          DB_URL: ${{ secrets.RAILWAY_STAGING_DATABASE_URL }}
        run: |
          echo "=== 1. Current Database & User ==="
          psql "$DB_URL" -c "SELECT current_database(), current_user, inet_server_addr(), inet_server_port();"
          
          echo "=== 2. API Keys in Database ==="
          psql "$DB_URL" -c "SELECT id, token, type, title FROM api_key;"

          echo "=== 3. Product Count in Database ==="
          psql "$DB_URL" -c "SELECT count(*) FROM product;"
